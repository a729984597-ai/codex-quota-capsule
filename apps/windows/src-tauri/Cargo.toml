[package]
name = "quota-capsule-windows"
version = "0.1.0"
description = "Windows Quota Capsule Beta"
authors = ["you"]
edition = "2021"

[lib]
name = "quota_capsule_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
